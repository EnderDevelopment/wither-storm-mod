plugins {
    id 'fabric-loom' version '1.0-SNAPSHOT'
    id 'maven-publish'
}

version = project.version

group = project.maven_group

archivesBaseName = project.archives_base_name

repositories {
    mavenCentral()
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

processResources {
    inputs.property 'version', project.version
}

loom {
    minecraftVersion = project.minecraft_version
    runConfigs.create('client') {
        property 'fabricApi', 'net.fabricmc:fabric-loader:${project.loader_version}'
    }
    runConfigs.create('server') {
        property 'fabricApi', 'net.fabricmc:fabric-loader:${project.loader_version}'
    }
}

dependencies {
    minecraft 'com.mojang:minecraft:${project.minecraft_version}'
    mappings 'net.fabricmc:yarn:${project.minecraft_version}:v2'
    modImplementation 'net.fabricmc:fabric-loader:${project.loader_version}'
    modImplementation 'net.fabricmc.fabric-api:fabric-api:1.0.0'
}